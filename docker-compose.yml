services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      # Persist MySQL data so database records survive container recreation.
      - mysql_data:/var/lib/mysql

      # Initialize the database schema when the MySQL volume is created.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      # Verify that MySQL is accepting connections before starting the app.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    # Use the Docker image already built by Jenkins.
    # Locally, it defaults to money-management:latest.
    # Jenkins overrides this with a specific build image such as
    # money-management:build-24.
    image: ${APP_IMAGE:-money-management:latest}

    restart: unless-stopped

    environment:
      # Use the Docker Compose service name to reach MySQL.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

    ports:
      # Map a configurable host port to Flask's internal port 5000.
      # Local Compose defaults to localhost:5000.
      # Jenkins CD uses APP_PORT=5001 to avoid a port conflict.
      - "${APP_PORT:-5000}:5000"

    depends_on:
      # Start Flask only after MySQL is healthy.
      mysql:
        condition: service_healthy


volumes:
  # Named volume provides persistent MySQL storage.
  mysql_data: